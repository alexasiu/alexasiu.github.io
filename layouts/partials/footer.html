{{ $cfg := hugo.Data.config }}
<div class="dashed"></div>
<p>You can contact me at <a href="mailto:{{ $cfg.email }}">{{ $cfg.email }}</a>.</p>

	{{ range $cfg.socials }}

	</li>
	{{ end }}
</ul>
